<!DOCTYPE html>
<hmtl lang="en">
    <head>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin: 8px;
                margin-left: 50px;
            }
            #box, #boxTwo{
                width: 75px;
                height: 75px;
                background-color:blue;
                color: azure;
                text-align: center;
                margin: 0 auto;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap
            }
        </style>
    </head>
   <body>
        <h1>Alignment Notes</h1>
        <div id="box-wrapper">
            <div id="boxTwo" onmouseover="dissappear()" onmouseout ="appear">
                <p>Box 1</p>
            </div>
            <div id="boxTwo">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
        <button onClick="color()">Click me</button>
        <button id="showMore" onClick="show()">Show More</button>
        </button>
        <script> //makes the webpage interactive
            function color(){ //document gets HTML, the .getElementById searches the HTML
                let newColor = document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor = newColor
            }
            function disappear(){
                document.getElementById("boxTwo").style.display = "none"
            }
            function appear(){
                document.getElementById("boxTwo").style.display = "block"
            }
            function show(){
                let element= document.getElementById(
                "flex-wrapper")
                if (element.style.display == "flex"){
                    element.style.display = "none"
                    document.getElementById("showMore").innerHTML = "Show More"
                }else{
                    element.style.display ="flex"
                    document.getElementById("showMore").innerHTML = "Show Less"
                }
            }
        </script>
   </body> 
</hmtl>
