<!DOCTYPE html>
<html lang = "en">
    <head>
        <title> Advanced HTML Notes</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Advanced HTML Notes</h1>
        <h3>Lists:</h3>
        <div>
        <ol type="a"> <!--This is a numbered list!-->
            <li>This is the first thing</li>
            <li>This is the second</li>
            <li>This is the third</li>
        </ol>
        <ul> <!--This is a bulletted list-->
            <li><a href="https://usapple.org/apple-varieties" target="_blank">Apple</a></li>
            <li>Banana</li>
            <li>Orange</li>
            <li>Kiwi</li>
        </ul>
        <dl>
            <dt>Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>New Years</dd>
            <dd>Hanukkah</dd>
        </dl>

        <h3>Attributes:</h3>
        <img src="https://globalsummitguide.com/wp-content/uploads/2026/07/AdobeStock_1146206325-scaled.jpeg" alt="Mount Timp" width="200px">
        <br>
        <img src="Notes\Mount_Timpanogos_at_sunset.jpg" alt="Sunset on Timp" width="200px">
        <p>Image from <a href="https://commons.wikimedia.org/wiki/File:Mount_Timpanogos_at_sunset.jpg" target="_blank">Wikimedia Commons</a></p>
    </div>

    </body>
</html>
