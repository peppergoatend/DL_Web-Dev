<!-- DL, CSS Styling with Color -->

<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>CSS styling with Color</title>
        <meta charset="UTF-8">
        <style>
            #C{color:white;text-align:center; background-color:blue; border:solid; border-color:orange; height:100px; width:100px}

            #A{color:yellow;text-align:center; background-color:red; border:solid; border-color:orange; height:100px; width:100px}
            
            #T{color:purple;text-align:center; background-color:green; border:solid; border-color:orange; height:100px; width:100px}
        </style>
    </head>
    <body>
        <h1>CSS Styling with</h1>
        <div id="C">
            <p>Complementary</p>
        </div>
        <div id="A">
            <p>Analogous</p>
        </div>
        <div id="T">
            <p>Triadic</p>
        </div>
    </body>
</html>
